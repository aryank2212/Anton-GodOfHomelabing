services:
  phoenix:
    build:
      context: .
      dockerfile: Dockerfile
    image: anton-phoenix:1.0.0
    container_name: anton-phoenix
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PHOENIX_DATABASE_URL: sqlite+aiosqlite:////data/phoenix.db
      PHOENIX_CONFIG_FILE: app/config/phoenix.yaml
      # Hermes runs on the same Docker network; use the service name as host.
      PHOENIX_HERMES_BASE_URL: http://hermes:8000
    ports:
      # Host port is configurable via PHOENIX_PORT (default 8010).
      - "${PHOENIX_PORT:-8010}:8010"
    volumes:
      - phoenix_data:/data
      # Let Phoenix talk to the Docker daemon so it can restart containers.
      - /var/run/docker.sock:/var/run/docker.sock
    # The container runs as uid 1000; give it the host docker group so it can
    # read/write the mounted socket. Set PHOENIX_DOCKER_GID to the host's
    # docker group id (check with: getent group docker).
    group_add:
      - "${PHOENIX_DOCKER_GID:-127}"
    networks:
      - anton-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  phoenix_data:

networks:
  anton-net:
    external: true
