[project]
name = "anton-phoenix"
version = "1.0.0"
description = "Phoenix — autonomous recovery and self-healing subsystem for Anton."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "docker>=7.0,<8.0",
    "psutil>=5.9,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
    "black>=24.0,<25.0",
    "mypy>=1.10,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# UP042: str+Enum pattern is intentional (works with pydantic + JSON).
# UP047: generic-function rewrite to PEP 695 is invasive and would break
#        ParamSpec-based signatures (safe_check) in Python 3.12.
ignore = ["UP042", "UP047"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
