services:
  watcher-api:
    build: .
    image: watcher-api:1.0.0
    container_name: watcher-api
    restart: unless-stopped
    environment:
      WATCHER_DB_HOST: host.docker.internal
      WATCHER_DB_PORT: "5438"
      WATCHER_DB_NAME: watcher
      WATCHER_DB_USER: watcher
      WATCHER_DB_PASSWORD: watcher123
      WATCHER_ALIASES_FILE: /app/aliases.json
    ports:
      - "8008:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
