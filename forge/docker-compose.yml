services:
  forge:
    image: anton/forge:1.0.0
    container_name: forge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./forge.yaml:/app/forge.yaml:ro
      - forge-data:/data
      - /opt/anton/notes:/data/notes
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "127"
    networks:
      - anton-net
    ports:
      # Reachable only on the tailnet so the Oracle gateway on the laptop can
      # call Forge over Tailscale (the tailnet IP of the Docker host).
      - "100.77.54.107:8092:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FORGE_WATCHER_URL: http://host.docker.internal:8008
      FORGE_PHOENIX_URL: http://phoenix:8010
      FORGE_HERMES_URL: http://hermes:8000
      FORGE_NOTES_DIR: /data/notes

volumes:
  forge-data:

networks:
  anton-net:
    name: anton-net
    external: true
