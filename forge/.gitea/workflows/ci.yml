name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: python312
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Secret scan
        run: gitleaks detect --source . --no-banner --redact
      - name: Install dependencies
        run: pip install -q -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: black --check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest -q
