# Alembic configuration for Argus.
#
# Argus runs migrations from within the app (Database.init -> alembic
# upgrade/stamp) and overrides the database URL per invocation, so the
# sqlalchemy.url below is only a fallback used by the CLI for one-off work.
# Script location is overridden at runtime too; keep it relative to this file
# so ``alembic revision --autogenerate`` works from the repo root.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///./data/argus.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S