[project]
name = "anton-argus"
version = "1.0.0"
description = "Argus — internet ingestion and intelligence subsystem for Anton."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "feedparser>=6.0,<7.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
    "black>=24.0,<25.0",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Make `app` importable when pytest runs without `python -m pytest` (CI).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["UP042", "UP047", "B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
