name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: python312
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Secret scan
        run: gitleaks detect --source . --no-banner --redact
      - name: Syntax check
        run: python3 -m py_compile pulse.py
      - name: Self-test
        run: python3 pulse.py --selftest
